<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduManage — Student Management System</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/students.css" />
  <link rel="stylesheet" href="css/teachers.css" />
  <link rel="stylesheet" href="css/courses.css" />
  <link rel="stylesheet" href="css/grades.css" />
  <link rel="stylesheet" href="css/attendance.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <!-- The entire application is rendered dynamically inside #app-root by app.js.
       This keeps EduManage a true single-page application: no other HTML file
       ever needs to be opened directly in the browser. -->
  <div id="app-root"></div>

  <!-- Core layer: order matters, each file depends on the ones before it -->
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>

  <!-- Feature modules -->
  <script src="js/dashboard.js"></script>
  <script src="js/students.js"></script>
  <script src="js/teachers.js"></script>
  <script src="js/courses.js"></script>
  <script src="js/grades.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/export.js"></script>

  <!-- Application shell / router — must load last -->
  <script src="js/app.js"></script>
</body>
</html>
